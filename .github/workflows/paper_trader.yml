name: Daily Paper Trading Execution Daemon

on:
  schedule:
    # 03:40 UTC = 09:10 AM IST (Monday to Friday)
    - cron: '40 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI or mobile browser

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  TZ: 'Asia/Kolkata'
  PYTHONUNBUFFERED: '1'

jobs:
  run-trading-bot:
    name: Execute Trading Strategy
    runs-on: ubuntu-latest
    timeout-minutes: 420 # 7-hour safety timeout

    # Explicit permissions to allow GitHub Actions to manage Release assets on developer forks
    permissions:
      contents: write

    # Guard Condition: Skips scheduled cron on the main shared repo to avoid unintended runs without secrets.
    # Runs automatically on developer forks, or whenever triggered manually via workflow_dispatch.
    if: github.repository != 'vaibhavreddys/algotradingdaily' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 Auto-Sync Latest Code from Upstream Main
        run: |
          if [ "${{ github.repository }}" != "vaibhavreddys/algotradingdaily" ]; then
            echo "⚡ Checking for latest upstream updates from vaibhavreddys/algotradingdaily:main..."
            git remote add upstream https://github.com/vaibhavreddys/algotradingdaily.git 2>/dev/null || true
            git fetch upstream main
            git merge upstream/main --ff-only 2>/dev/null || git rebase upstream/main 2>/dev/null || true
            echo "✅ Runner synced to latest upstream commit: $(git rev-parse --short HEAD)"
          else
            echo "ℹ️ Running on upstream origin repository."
          fi

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📂 Restore Cumulative Trade Journal from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p database
          echo "Checking for existing cumulative journal in 'journal-latest' release..."
          if gh release view journal-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download journal-latest --pattern "paper_trades.db" --dir database/ --repo "${{ github.repository }}" --clobber || true
            if [ -f database/paper_trades.db ]; then
              echo "✅ Successfully restored cumulative trade journal (size: $(wc -c < database/paper_trades.db) bytes)."
            else
              echo "ℹ️ No existing journal file found in release. A fresh journal will be created today."
            fi
          else
            echo "ℹ️ Release 'journal-latest' does not exist yet. It will be created at EOD."
          fi

      - name: 🚀 Run Paper Trading Engine
        env:
          TZ: 'Asia/Kolkata'
          PYTHONUNBUFFERED: '1'
          SHOONYA_USER: ${{ secrets.SHOONYA_USER }}
          SHOONYA_PWD: ${{ secrets.SHOONYA_PWD }}
          SHOONYA_API_KEY: ${{ secrets.SHOONYA_API_KEY }}
          SHOONYA_VENDOR_CODE: ${{ secrets.SHOONYA_VENDOR_CODE }}
          SHOONYA_TOTP_KEY: ${{ secrets.SHOONYA_TOTP_KEY }}
          SHOONYA_IMEI: ${{ secrets.SHOONYA_IMEI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_INVITE_CODE: ${{ secrets.TELEGRAM_INVITE_CODE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          # The engine broadcasts to all active subscribers in
          # database/telegram_subscribers.db. The bot long-polling process is
          # NOT started here (GitHub Actions workflows are ephemeral) — for
          # 24/7 /start discovery, run `python -m alerts.tg_bot` on a
          # long-lived host (see README). The seeded TELEGRAM_CHAT_ID keeps
          # the owner's own chat active during this run.
          python -u -m live_trading.paper_trader

      - name: 🏷️ Persist Cumulative Trade Journal to Release Asset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f database/paper_trades.db ]; then
            echo "Saving cumulative journal ($(wc -c < database/paper_trades.db) bytes) to 'journal-latest' release..."
            # Create release if it doesn't exist, otherwise upload/clobber asset
            gh release create journal-latest database/paper_trades.db \
              --title "Cumulative Trade Journal (Permanent)" \
              --notes "Permanent cumulative SQLite trade database asset across daily paper trading sessions." \
              --repo "${{ github.repository }}" 2>/dev/null || \
            gh release upload journal-latest database/paper_trades.db \
              --clobber \
              --repo "${{ github.repository }}"
            echo "✅ Cumulative journal saved permanently to 'journal-latest' release."
          else
            echo "⚠️ No database/paper_trades.db file found to persist."
          fi

      - name: 📤 Persist Trade Database Artifact (30-Day Backup)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: paper-trade-database
          path: database/paper_trades.db
          retention-days: 30
          if-no-files-found: ignore
