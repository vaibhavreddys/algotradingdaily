<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgoTradingDaily · Charts</title>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1015;
    --surface: #141821;
    --surface-2: #1c222d;
    --surface-3: #252d3a;
    --border: #262e3b;
    --border-strong: #38445a;
    --text: #e8ecf4;
    --muted: #8a93a6;
    --faint: #5a6375;
    --accent: #4a7bd0;
    --accent-hover: #5a89da;
    --accent-bright: #93b8f2;
    --accent-soft: rgba(96, 144, 235, .13);
    --up: #2ebd85;
    --down: #f6465d;
    --up-soft: rgba(46, 189, 133, .14);
    --down-soft: rgba(246, 70, 93, .14);
    --warn: #d9a03f;
    --warn-soft: rgba(217, 160, 63, .13);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --r-ctl: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 var(--sans);
    display: flex; flex-direction: column;
  }

  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 9px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar { padding: 11px 14px; }
  .controlbar { padding: 8px 14px; background: var(--bg); }
  .statusbar { min-height: 32px; padding: 6px 14px; font-size: 12.5px; color: var(--muted); }
  .flex-sp { flex: 1; }

  .brand {
    font-size: 14.5px; font-weight: 700; letter-spacing: -.2px;
    margin-right: 10px; white-space: nowrap;
  }
  .brand em { font-style: normal; color: var(--accent-bright); }
  .brand .dim { color: var(--faint); font-weight: 500; }

  input, select, button {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--r-ctl);
    padding: 6px 11px; font: inherit; outline: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .08s ease;
  }
  input:hover, select:hover { border-color: var(--border-strong); }
  input:focus-visible, select:focus-visible, button:focus-visible {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type="date"] { color-scheme: dark; font-family: var(--mono); font-size: 12px; }
  #symbol { width: 168px; text-transform: uppercase; font-weight: 600; letter-spacing: .4px; font-family: var(--mono); font-size: 12.5px; }
  #dbfile { max-width: 280px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  select { cursor: pointer; }

  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-3); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: var(--accent); border-color: transparent; color: #fff; font-weight: 600;
    padding: 6px 18px;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: transparent; }
  @media (prefers-reduced-motion: no-preference) {
    button.primary.busy { animation: pulse 1.1s ease-in-out infinite; }
  }
  @keyframes pulse { 50% { opacity: .55; } }

  .seg {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  }
  .seg button {
    border: none; background: transparent; border-radius: 7px;
    padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted);
  }
  .seg button:hover:not(:disabled) { background: transparent; color: var(--text); }
  .seg button.active { background: var(--accent-soft); color: var(--accent-bright); }

  .pill {
    display: inline-flex; align-items: center; cursor: pointer; user-select: none;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--muted); font-size: 12px; font-weight: 600;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .pill:hover { color: var(--text); border-color: var(--border-strong); }
  .pill.on { color: var(--accent-bright); border-color: rgba(96, 144, 235, .5); background: var(--accent-soft); }
  .pill input { display: none; }
  .pill.disabled { opacity: .4; pointer-events: none; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
  .arrow { color: var(--faint); }

  .badge {
    display: none; margin-left: auto; padding: 3px 11px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
    border: 1px solid rgba(217, 160, 63, .35);
    font-weight: 600; font-size: 12px;
  }
  .badge.show { display: inline-block; }

  #chart-wrap { flex: 1; position: relative; min-height: 200px; }
  #chart { position: absolute; inset: 0; }
  #legend {
    position: absolute; top: 12px; left: 14px; z-index: 5; pointer-events: none;
    background: rgba(13, 16, 21, .84); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: var(--r-ctl);
    padding: 9px 13px; font-size: 12px; line-height: 1.7;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  #legend .row1 {
    font-family: var(--sans); font-weight: 700; font-size: 13px; margin-bottom: 2px;
  }
  #legend .row1 .dim { font-weight: 500; font-size: 11.5px; margin-left: 7px; }
  #legend .k { color: var(--faint); }
  #legend .chg { padding: 1px 7px; border-radius: 999px; font-weight: 700; margin-left: 6px; }
  #legend .chg.up { background: var(--up-soft); color: var(--up); }
  #legend .chg.down { background: var(--down-soft); color: var(--down); }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .dim { color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #2a1216; color: #ffb3bd; border: 1px solid rgba(246, 70, 93, .4);
    padding: 9px 18px; border-radius: var(--r-ctl);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20;
    max-width: 70%; box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    font-size: 12.5px;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="bar topbar">
  <div class="brand">AlgoTrading<em>Daily</em> <span class="dim">/ charts</span></div>
  <select id="dbfile" title="DuckDB database file (discovered in market_data/)"></select>
  <input id="symbol" list="symbols" placeholder="SYMBOL" spellcheck="false" autocomplete="off">
  <datalist id="symbols"></datalist>
  <div id="tf-group" class="seg" role="group" aria-label="Timeframe" title="Timeframe"></div>
  <span class="flex-sp"></span>
  <button id="load" class="primary">Load</button>
</header>

<div class="bar controlbar">
  <input type="date" id="from" title="From (IST)">
  <span class="arrow">→</span>
  <input type="date" id="to" title="To (IST)">
  <div id="ranges" class="seg" role="group" aria-label="Quick range">
    <button type="button" data-days="1">1D</button>
    <button type="button" data-days="7">1W</button>
    <button type="button" data-days="30">1M</button>
    <button type="button" data-days="90">3M</button>
    <button type="button" data-days="180">6M</button>
    <button type="button" data-days="365">1Y</button>
    <button type="button" data-days="all">ALL</button>
  </div>
  <span class="flex-sp"></span>
  <label class="pill" id="lbl-sma20" title="Simple moving average, 20 bars"><input type="checkbox" id="sma20">SMA 20</label>
  <label class="pill" id="lbl-sma50" title="Simple moving average, 50 bars"><input type="checkbox" id="sma50">SMA 50</label>
  <label class="pill" id="lbl-ema9" title="Exponential moving average, 9 bars"><input type="checkbox" id="ema9">EMA 9</label>
  <label class="pill" id="lbl-vwap" title="Intraday VWAP, resets each session"><input type="checkbox" id="vwap">VWAP</label>
  <label class="pill" id="lbl-volma" title="20-bar moving average of volume"><input type="checkbox" id="volma">Vol MA 20</label>
  <span class="sep"></span>
  <label class="pill" id="lbl-log" title="Logarithmic price scale"><input type="checkbox" id="logscale">Log</label>
  <button id="csv" title="Download the loaded range as CSV (IST timestamps)">CSV</button>
</div>

<div class="bar statusbar">
  <span id="info">Initializing…</span>
  <span id="stale" class="badge">Aggregates stale — rerun: python openalgo_ingest.py --action aggregate</span>
</div>

<main id="chart-wrap">
  <div id="chart"></div>
  <div id="legend"></div>
</main>
<div id="toast"></div>

<script>
const TF_LABEL = {"ohlcv_1m":"1m","ohlcv_5m":"5m","ohlcv_15m":"15m","ohlcv_1h":"1h","ohlcv_1d":"1d"};
const MONO = "ui-monospace, 'SF Mono', Menlo, monospace";
const IST_OFFSET = 19800;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LS_KEY = "openalgo_viz_prefs";

const $ = id => document.getElementById(id);
let prefs = {};
const symbolEl = $("symbol"), fromEl = $("from"), toEl = $("to");
const dbEl = $("dbfile"), infoEl = $("info"), staleEl = $("stale"), toastEl = $("toast"), legendEl = $("legend");

let chart, candleSeries, volumeSeries, maLines, vwapSeries;
let lastMeta = null, lastPayload = null, pts = [];
let dbTables = [];
let tf = "ohlcv_15m";

const tfLabel = t => TF_LABEL[t] || t;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 4000);
}

async function fetchJSON(url) {
  const res = await fetch(url);
  const body = await res.json().catch(() => ({error: res.statusText}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

const pad = n => String(n).padStart(2, "0");

function istParts(sec) {
  const d = new Date((sec + IST_OFFSET) * 1000);
  return {
    Y: d.getUTCFullYear(), M: d.getUTCMonth(), D: d.getUTCDate(),
    H: d.getUTCHours(), Mi: d.getUTCMinutes(),
  };
}

function istDateTime(sec) {
  const p = istParts(sec);
  return `${p.Y}-${pad(p.M + 1)}-${pad(p.D)} ${pad(p.H)}:${pad(p.Mi)} IST`;
}

function istTickLabel(sec) {
  const p = istParts(sec);
  if (tf === "ohlcv_1d") return `${p.D} ${MONTHS[p.M]}`;
  if (p.H === 9 && p.Mi === 15) return `${p.D} ${MONTHS[p.M]}`;
  return `${pad(p.H)}:${pad(p.Mi)}`;
}

function fmtNum(n) {
  return n.toLocaleString("en-IN", {maximumFractionDigits: 2});
}

function fmtVol(v) {
  if (v >= 1e7) return (v / 1e7).toFixed(2) + " Cr";
  if (v >= 1e5) return (v / 1e5).toFixed(2) + " L";
  if (v >= 1e3) return (v / 1e3).toFixed(1) + "K";
  return String(v);
}

function initChart() {
  const wrap = $("chart-wrap");
  chart = LightweightCharts.createChart($("chart"), {
    width: wrap.clientWidth, height: wrap.clientHeight,
    layout: {background: {color: "transparent"}, textColor: "#8a93a6", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif", fontSize: 11},
    grid: {vertLines: {color: "#161c26"}, horzLines: {color: "#161c26"}},
    rightPriceScale: {
      borderColor: "#262e3b", scaleMargins: {top: 0.08, bottom: 0.28},
      entireTextOnly: true,
    },
    timeScale: {
      borderColor: "#262e3b", timeVisible: true, secondsVisible: false,
      rightOffset: 3, barSpacing: 7,
      tickMarkFormatter: t => istTickLabel(t),
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: {color: "#414d63", width: 1, style: 3, labelBackgroundColor: "#2a3342"},
      horzLine: {color: "#414d63", width: 1, style: 3, labelBackgroundColor: "#2a3342"},
    },
    localization: {timeFormatter: t => istDateTime(t)},
    watermark: {visible: false},
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: "#2ebd85", downColor: "#f6465d",
    wickUpColor: "#2ebd85", wickDownColor: "#f6465d", borderVisible: false,
  });
  volumeSeries = chart.addHistogramSeries({priceFormat: {type: "volume"}, priceScaleId: ""});
  volumeSeries.priceScale().applyOptions({scaleMargins: {top: 0.82, bottom: 0}});
  maLines = {
    sma20: chart.addLineSeries({color: "#d9a03f", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false}),
    sma50: chart.addLineSeries({color: "#93b8f2", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false}),
    ema9: chart.addLineSeries({color: "#e0876a", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false}),
  };
  vwapSeries = chart.addLineSeries({color: "#b48ce8", lineWidth: 2, lineStyle: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false});
  chart.subscribeCrosshairMove(updateLegend);
  new ResizeObserver(() => chart.applyOptions({width: wrap.clientWidth, height: wrap.clientHeight})).observe(wrap);
}

function sma(values, n) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= n) sum -= values[i - n];
    if (i >= n - 1) out.push({time: pts[i].time, value: sum / n});
  }
  return out;
}

function ema(values, n) {
  const out = [];
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < values.length; i++) {
    prev = prev === null ? values[i] : values[i] * k + prev * (1 - k);
    if (i >= n - 1) out.push({time: pts[i].time, value: prev});
  }
  return out;
}

function vwapSeriesData() {
  const out = [];
  let cumPV = 0, cumV = 0, curDay = null;
  for (const p of pts) {
    const day = Math.floor((p.time + IST_OFFSET) / 86400);
    if (day !== curDay) { curDay = day; cumPV = 0; cumV = 0; }
    const tp = (p.high + p.low + p.close) / 3;
    cumPV += tp * p.volume; cumV += p.volume;
    out.push({time: p.time, value: cumV ? cumPV / cumV : tp});
  }
  return out;
}

function render(payload) {
  pts = payload.candles.map(c => ({
    time: c[0], open: c[1], high: c[2], low: c[3], close: c[4], volume: c[5],
  }));
  candleSeries.setData(pts.map(p => ({time: p.time, open: p.open, high: p.high, low: p.low, close: p.close})));
  volumeSeries.setData(pts.map(p => ({
    time: p.time, value: p.volume,
    color: p.close >= p.open ? "rgba(46,189,133,.35)" : "rgba(246,70,93,.35)",
  })));
  updateOverlays();
  chart.applyOptions({
    watermark: {
      visible: true,
      text: `${payload.symbol}  ${tfLabel(payload.table)}${payload.count ? "" : "  ·  no data"}`,
      color: "rgba(138,147,166,.12)", fontFamily: MONO, fontSize: 44,
      horizontalAlign: "center", verticalAlign: "center",
    },
  });
  chart.timeScale().fitContent();
  updateLegend({time: undefined});
}

function updateOverlays() {
  const closes = pts.map(p => p.close);
  const vols = pts.map(p => p.volume);
  maLines.sma20.setData($("sma20").checked && pts.length > 20 ? sma(closes, 20) : []);
  maLines.sma50.setData($("sma50").checked && pts.length > 50 ? sma(closes, 50) : []);
  maLines.ema9.setData($("ema9").checked && pts.length > 9 ? ema(closes, 9) : []);
  vwapSeries.setData($("vwap").checked && tf !== "ohlcv_1d" ? vwapSeriesData() : []);
  const volMa = sma(vols, 20).map(o => ({time: o.time, value: o.value}));
  if ($("volma").checked && volMa.length) {
    maLines.volMa = maLines.volMa || (() => {
      const s = chart.addLineSeries({color: "rgba(232,236,244,.55)", lineWidth: 1, priceScaleId: "", priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false});
      s.priceScale().applyOptions({scaleMargins: {top: 0.82, bottom: 0}});
      return s;
    })();
    maLines.volMa.setData(volMa);
  } else if (maLines.volMa) {
    maLines.volMa.setData([]);
  }
}

function updateLegend(param) {
  if (!pts.length) { legendEl.innerHTML = ""; return; }
  let idx = pts.length - 1;
  if (param && param.time !== undefined && param.time !== null) {
    const found = pts.findIndex(p => p.time === param.time);
    if (found >= 0) idx = found;
  }
  const p = pts[idx];
  const prev = idx > 0 ? pts[idx - 1].close : p.open;
  const chg = p.close - prev;
  const chgPct = prev ? (chg / prev) * 100 : 0;
  const cls = chg >= 0 ? "up" : "down";
  const arrow = chg >= 0 ? "▲" : "▼";
  const sym = lastPayload ? lastPayload.symbol : "";
  legendEl.innerHTML =
    `<div class="row1">${sym} <span class="dim">${tfLabel(lastPayload ? lastPayload.table : tf)} · ${istDateTime(p.time)}</span></div>` +
    `<span class="${cls}">${arrow} ${fmtNum(p.close)}</span>
     <span class="k">O</span> ${fmtNum(p.open)}
     <span class="k">H</span> ${fmtNum(p.high)}
     <span class="k">L</span> <span class="${p.low <= prev ? "" : cls}">${fmtNum(p.low)}</span>
     <span class="k">V</span> ${fmtVol(p.volume)}
     <span class="chg ${cls}">${chg >= 0 ? "+" : ""}${chgPct.toFixed(2)}%</span>`;
}

function setInfo(payload) {
  const parts = [`<b style="color:var(--text)">${payload.symbol}</b> · ${tfLabel(payload.table)}`];
  parts.push(`${payload.count.toLocaleString("en-IN")} candles`);
  if (payload.truncated) parts.push(`<span style="color:var(--warn)">showing most recent (limit reached)</span>`);
  if (payload.count > 0) {
    parts.push(`${istDateTime(payload.candles[0][0]).slice(0, 16)} → ${istDateTime(payload.candles[payload.count - 1][0]).slice(0, 16)}`);
  }
  infoEl.innerHTML = parts.join('&nbsp;&nbsp;·&nbsp;&nbsp;');
  infoEl.style.color = payload.count === 0 ? "var(--down)" : "";
}

function checkStaleness() {
  staleEl.classList.remove("show");
  fetchJSON("/api/freshness?db=" + encodeURIComponent(dbEl.value)).then(fresh => {
    if (!(tf in fresh)) return;
    const base = fresh.ohlcv_1m ? fresh.ohlcv_1m.max_ts : null;
    const agg = fresh[tf];
    if (base && agg && agg.max_ts && base - agg.max_ts > 12 * 3600) staleEl.classList.add("show");
  }).catch(() => {});
}

function savePrefs() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      db: dbEl.value, symbol: symbolEl.value, tf,
      sma20: $("sma20").checked, sma50: $("sma50").checked,
      ema9: $("ema9").checked, vwap: $("vwap").checked,
      volma: $("volma").checked, log: $("logscale").checked,
    }));
  } catch (e) {}
}

function applyLogScale(on) {
  chart.applyOptions({rightPriceScale: {mode: on ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal}});
}

async function load() {
  const symbol = symbolEl.value.trim().toUpperCase();
  if (!symbol) { toast("Enter a symbol"); return; }
  const loadBtn = $("load");
  loadBtn.disabled = true;
  loadBtn.classList.add("busy");
  loadBtn.textContent = "Loading";
  infoEl.textContent = "Loading…";
  savePrefs();
  try {
    const qs = new URLSearchParams({symbol, table: tf, db: dbEl.value});
    if (fromEl.value) qs.set("start", fromEl.value);
    if (toEl.value) qs.set("end", toEl.value);
    const payload = await fetchJSON("/api/candles?" + qs);
    if (payload.truncated) toast(`Showing the most recent ${payload.count.toLocaleString("en-IN")} candles — narrow the date range to see older data`);
    lastPayload = payload;
    render(payload);
    setInfo(payload);
    checkStaleness();
  } catch (err) {
    infoEl.textContent = err.message;
    infoEl.style.color = "var(--down)";
    toast(err.message);
  } finally {
    loadBtn.disabled = false;
    loadBtn.classList.remove("busy");
    loadBtn.textContent = "Load";
  }
}

async function loadDatabases() {
  const {databases} = await fetchJSON("/api/databases");
  dbEl.innerHTML = databases.map(d =>
    `<option value="${d.path}">${d.folder ? d.folder + "/" : ""}${d.name}</option>`).join("");
  const pick = (prefs.db && databases.some(d => d.path === prefs.db) && prefs.db)
    || (databases.find(d => d.path === "market_data/openalgo/backtest_data.duckdb") || {}).path
    || (databases[0] || {}).path;
  if (pick) dbEl.value = pick;
}

async function loadTables() {
  const {tables} = await fetchJSON("/api/tables?db=" + encodeURIComponent(dbEl.value));
  dbTables = tables.map(t => t.name);
  if (!dbTables.length) throw new Error("No OHLCV tables found in this database");
  const group = $("tf-group");
  group.innerHTML = dbTables.map(t =>
    `<button type="button" data-tf="${t}" title="${tables.find(x => x.name === t).rows.toLocaleString("en-IN")} rows">${tfLabel(t)}</button>`).join("");
  group.style.display = dbTables.length > 1 ? "" : "none";
  group.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      if (tf === b.dataset.tf) return;
      applyTf(b.dataset.tf);
      savePrefs();
      $("vwap").disabled = tf === "ohlcv_1d";
      if (tf === "ohlcv_1d") { $("vwap").checked = false; $("lbl-vwap").classList.remove("on"); }
      refreshSymbols().catch(() => {});
      refreshBounds(false).then(() => { if (symbolEl.value.trim()) load(); });
    }));
}

function applyTf(t) {
  tf = t;
  document.querySelectorAll("#tf-group button").forEach(b =>
    b.classList.toggle("active", b.dataset.tf === t));
}

async function refreshSymbols() {
  const qs = new URLSearchParams({table: tf, db: dbEl.value});
  const syms = await fetchJSON("/api/symbols?" + qs);
  $("symbols").innerHTML = syms.symbols.map(s => `<option value="${s}">`).join("");
  return syms.symbols;
}

async function refreshBounds(keepRange) {
  try {
    lastMeta = await fetchJSON("/api/meta?table=" + tf + "&db=" + encodeURIComponent(dbEl.value));
    if (!lastMeta.min_ts) { infoEl.textContent = `No rows in ${tfLabel(tf)}`; return; }
    fromEl.min = toEl.min = fmtDate(lastMeta.min_ts);
    fromEl.max = toEl.max = fmtDate(lastMeta.max_ts);
    if (!keepRange) quickRange("all");
  } catch (err) { infoEl.textContent = err.message; }
}

function fmtDate(sec) {
  return new Date((sec + IST_OFFSET) * 1000).toISOString().slice(0, 10);
}

function quickRange(days) {
  if (!lastMeta || !lastMeta.max_ts) return;
  document.querySelectorAll("#ranges button").forEach(b =>
    b.classList.toggle("active", b.dataset.days === String(days)));
  toEl.value = fmtDate(lastMeta.max_ts);
  if (days === "all") {
    fromEl.value = fmtDate(lastMeta.min_ts);
  } else {
    const anchor = new Date((lastMeta.max_ts + IST_OFFSET) * 1000);
    anchor.setUTCDate(anchor.getUTCDate() - days + 1);
    anchor.setUTCHours(0, 0, 0, 0);
    fromEl.value = anchor.toISOString().slice(0, 10);
  }
}

function exportCSV() {
  if (!lastPayload || !lastPayload.count) { toast("Nothing to export"); return; }
  const rows = ["timestamp_ist,symbol,timeframe,open,high,low,close,volume"];
  for (const c of lastPayload.candles) {
    rows.push([istDateTime(c[0]), lastPayload.symbol, tfLabel(lastPayload.table), ...c.slice(1)].join(","));
  }
  const blob = new Blob([rows.join("\n")], {type: "text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${lastPayload.symbol}_${tfLabel(lastPayload.table)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

for (const [id, fn] of [
  ["sma20", updateOverlays], ["sma50", updateOverlays], ["ema9", updateOverlays],
  ["vwap", updateOverlays], ["volma", updateOverlays],
]) {
  $(id).addEventListener("change", () => {
    $("lbl-" + id).classList.toggle("on", $(id).checked);
    fn(); savePrefs();
  });
}
$("logscale").addEventListener("change", () => {
  $("lbl-log").classList.toggle("on", $("logscale").checked);
  applyLogScale($("logscale").checked); savePrefs();
});

document.querySelectorAll("#ranges button").forEach(b =>
  b.addEventListener("click", () => quickRange(b.dataset.days)));
dbEl.addEventListener("change", async () => {
  try {
    await loadTables();
    $("vwap").disabled = tf === "ohlcv_1d";
    if (tf === "ohlcv_1d") { $("vwap").checked = false; $("lbl-vwap").classList.remove("on"); }
    if (!dbTables.includes(tf)) applyTf(dbTables.includes("ohlcv_15m") ? "ohlcv_15m" : dbTables[0]);
    const symbols = await refreshSymbols();
    const want = symbolEl.value.trim().toUpperCase();
    symbolEl.value = symbols.includes(want) ? want
      : (symbols.includes("RELIANCE") ? "RELIANCE" : symbols[0] || "");
    lastPayload = null; pts = [];
    await refreshBounds(false);
    if (symbolEl.value.trim()) load();
    else { infoEl.textContent = "No symbols in this database yet"; candleSeries.setData([]); volumeSeries.setData([]); }
  } catch (err) {
    infoEl.textContent = err.message;
    toast(err.message);
  }
});
$("load").addEventListener("click", load);
$("csv").addEventListener("click", exportCSV);
symbolEl.addEventListener("keydown", e => { if (e.key === "Enter") load(); });
fromEl.addEventListener("change", () => {
  document.querySelectorAll("#ranges button").forEach(b => b.classList.remove("active"));
  if (toEl.value && fromEl.value > toEl.value) toEl.value = fromEl.value;
});
toEl.addEventListener("change", () => {
  document.querySelectorAll("#ranges button").forEach(b => b.classList.remove("active"));
  if (fromEl.value && toEl.value < fromEl.value) fromEl.value = toEl.value;
});

(async function init() {
  try { prefs = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) {}
  initChart();
  try {
    await loadDatabases();
    await loadTables();
    applyTf(prefs.tf && dbTables.includes(prefs.tf) ? prefs.tf
      : (dbTables.includes("ohlcv_15m") ? "ohlcv_15m" : dbTables[0]));
    for (const k of ["sma20", "sma50", "ema9", "vwap", "volma", "logscale"]) {
      if (k in prefs) { $(k).checked = !!prefs[k]; $("lbl-" + k.replace("logscale", "log")).classList.toggle("on", !!prefs[k]); }
    }
    $("vwap").disabled = tf === "ohlcv_1d";
    applyLogScale($("logscale").checked);
    const symbols = await refreshSymbols();
    symbolEl.value = (prefs.symbol && symbols.includes(prefs.symbol)) ? prefs.symbol
      : (symbols.includes("RELIANCE") ? "RELIANCE" : symbols[0] || "");
    await refreshBounds(true);
    quickRange("all");
    if (symbolEl.value) load();
    else infoEl.textContent = "No symbols in this database yet";
  } catch (err) {
    infoEl.textContent = err.message;
    toast(err.message);
  }
})();
</script>
</body>
</html>
